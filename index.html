<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keyfinder Studio</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #10101c;
      color: #f5f3ff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main { max-width: 620px; padding: 32px; }
    h1 { font-size: 44px; }
    p { line-height: 1.7; color: #bcb8d0; }
    a { color: #bd9aff; }
  </style>
</head>
<body>
  <main>
    <h1>Keyfinder Studio</h1>
    <p>
      A music discovery and research tool for exploring
      songs by musical key, BPM, artist, genre,
      release year, and popularity.
    </p>
    <p>Currently in development.</p>
    <footer>
      Musical key and BPM data provided by
      <a href="https://getsongbpm.com/">
        GetSongBPM
      </a>.
    </footer>
  </main>
</body>
</html>
